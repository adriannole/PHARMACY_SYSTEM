name: CI/CD Pipeline for Inventory Service

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend/inventory
        push: true
        tags: adrixer25/inventory_service:latest  # ✅ Se corrige el tag de Docker Hub

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_INVENTORY }}
        username: ${{ secrets.EC2_USER_INVENTORY }}
        key: ${{ secrets.EC2_KEY_INVENTORY }}
        port: 22
        script: |
          docker stop inventory_service || true  # ✅ Detener si está corriendo # ✅ 
          docker rm inventory_service || true  # ✅ Eliminar si existe
          docker pull adrixer25/inventory_service:latest  # ✅ Asegurar descarga de la imagen
          docker run -d -p 4015:4015 --name inventory_service adrixer25/inventory_service:latest  # ✅ Asignar nombre al contenedor
