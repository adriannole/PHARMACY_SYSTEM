name: CI/CD Pipeline for Search Products Service

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend/search_products
        push: true
        tags: adrixer25/search_products_service:latest  # ✅ Corrección del tag

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_SEARCH_PRODUCTS }}
        username: ${{ secrets.EC2_USER_SEARCH_PRODUCTS }}
        key: ${{ secrets.EC2_KEY_SEARCH_PRODUCTS }}
        script: |
          docker stop search_products_service || true  # ✅ Detne el contenedor anterior si existe # ✅
          docker rm search_products_service || true  # ✅ Elimina el contenedor anterior si existe
          docker pull adrixer25/search_products_service:latest  # ✅ Corrige el tag
          docker run -d -p 4009:4009 --name search_products_service adrixer25/search_products_service:latest  # ✅ Agrega nombre al contenedor
