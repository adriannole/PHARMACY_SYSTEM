name: CI/CD Pipeline for Register Service

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend/register
        push: true
        tags: adrixer25/register_service:latest  # ✅ Asegúrate de que el nombre del repositorio sea correcto

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_REGISTER }}
        username: ${{ secrets.EC2_USER_REGISTER }}
        key: ${{ secrets.EC2_KEY_REGISTER }}
        script: |
          docker stop register_service || true  # ✅ Asegúrate de que el nombre del contenedor sea correcto
          docker rm register_service || true  # ✅ Asegúrate de que el nombre del contenedor sea correcto
          docker pull adrixer25/register_service:latest  # ✅ Asegúrate de que el nombre de la imagen sea correcto
          docker run -d -p 4007:4007 --name register_service adrixer25/register_service:latest  # ✅ Verifica que el puerto 4006 esté disponible
