name: CI/CD Pipeline for Update Quantity Service

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend/update_quantity
        push: true
        tags: adrixer25/update_quantity_service:latest  # ✅ Asegúrate de que el nombre de la imagen es correcto

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_UPDATE_QUANTITY }}
        username: ${{ secrets.EC2_USER_UPDATE_QUANTITY }}
        key: ${{ secrets.EC2_KEY_UPDATE_QUANTITY }}
        script: |
          docker stop update_quantity_service || true  # ✅ Asegrae de que el nombre del contenedor es correcto 
          docker rm update_quantity_service || true  # ✅ Asegúrate de que el nombre del contenedor es correcto # ✅
          docker pull adrixer25/update_quantity_service:latest  # ✅ Verifica que el nombre de la imagen y el repositorio son correctos
          docker run -d -p 4011:4011 --name update_quantity_service adrixer25/update_quantity_service:latest  # ✅ Verifica que el puerto 4010 no esté en uso
